name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # MCP SERVER TESTS (Python)
  # ============================================
  test-mcp-server:
    name: MCP Server Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check ctm_mcp_server

      - name: Format check (ruff)
        run: uv run ruff format --check ctm_mcp_server

      - name: Run tests
        run: uv run pytest tests/ -v --cov=ctm_mcp_server --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ============================================
  # VSCODE EXTENSION TESTS (TypeScript)
  # ============================================
  test-vscode-extension:
    name: VSCode Extension Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: extensions/vscode
        run: npm ci

      - name: Lint (ESLint)
        working-directory: extensions/vscode
        run: npm run lint

      - name: Type check (TypeScript)
        working-directory: extensions/vscode
        run: npm run compile

      - name: Run tests
        working-directory: extensions/vscode
        run: npm test

  # ============================================
  # PUBLISH TO TEST PYPI (on merge to main)
  # ============================================
  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [test-mcp-server, test-vscode-extension]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
